syntax = "proto3";

option go_package = "../protobuf";

message RequestVoteArgs {
  int64 term = 1;
  int64 candidateId = 2;
  int64 lastLogIndex = 3;
  int64  lastLogTerm = 4;
}

message RequestVoteArgsResponse {
  int64 term = 1;
  bool voteGranted = 2;
}

message LogEntry {
  int64 term = 1;
  bytes command = 2;
}

message AppendEntriesArgs {
  int64 term = 1;
  int64 leaderId = 2;
  int64 prevLogIndex = 3;
  int64  prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int64 leaderCommit = 6;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
}

service RaftService {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteArgsResponse);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
}